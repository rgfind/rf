[package]
name = "rf"
version = "0.0.8"
edition = "2021"
description = "rf — search results that agents can inspect, explain, and safely continue from. Fuses ripgrep and fd, attributes every miss to the filter that hid it, and returns one typed JSON envelope. Early development; see the repository for status."
license = "Apache-2.0"
repository = "https://github.com/rgfind/rf"
keywords = ["ripgrep", "fd", "search", "cli", "grep"]
categories = ["command-line-utilities"]
readme = "README.md"
# Write-once publish: ship ONLY the product surface. An allowlist (not an
# exclude blocklist) keeps internal material — the .beads/ tracker, bench/
# harness, and internal contract-QA fixtures — out of the crates.io archive by
# construction, so a new internal file cannot leak in later. The `conformance`
# verb is compiled in and unaffected; only the cargo-test suite stops shipping.
# Patterns are gitignore-style: a leading "/" anchors to the package root, so a
# bare "README.md" would also match bench/README.md and internal fixture READMEs.
# Anchor every entry to ship only the root product surface.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRACT.md",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
]

# The root package is the sole workspace member. The contract guardrail is no
# longer an in-repo member: it is `plumbline` (https://github.com/rgfind/plumbline),
# invoked by name as `plumb`, configured by `plumbline.json`. cargo strips this
# [workspace] table from the packaged manifest.
[workspace]
resolver = "2"

[[bin]]
name = "rf"
path = "src/main.rs"

[features]
# The per-stage fault-injection seam (probeability rule P-d). OFF by default, so
# the crates.io release binary carries no injection surface at all. Enable it
# (`cargo test --features fault-injection`) to prove the totality wrapper converts
# a real per-stage backend fault into a total error envelope.
fault-injection = []

[dependencies]
# ripgrep's and fd's own guts, linked in-process. This is the whole point of the
# port: match provenance and file classification are read natively, not
# reconstructed from a shell pipe's stdout.
ignore = "0.4"            # fd/ripgrep's walker + .gitignore/.ignore semantics
grep-regex = "0.1"        # ripgrep's regex matcher
grep-matcher = "0.1"      # matcher trait for bounded per-occurrence evidence
grep-searcher = "0.1"     # ripgrep's searcher (binary detection, encodings)

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pathdiff = "0.2"

[profile.release]
strip = true
lto = true
