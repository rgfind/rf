name: Release

# The publish robot. One trigger, then hands-off.
#
# Primary path: run this workflow with the "Run workflow" button
# (workflow_dispatch) on main. It resolves the version from Cargo.toml, reruns
# the full preflight stop-sign, then creates and pushes the v<version> tag and
# does the REAL `cargo publish`. Both plumb commands now live in CI: the
# releaser triggers once and watches, and never runs plumb locally.
#
# Back-compat path: a pushed v<version> tag also runs this job. The tag already
# exists in that case, so the tag-creation step is skipped.
#
# A red preflight means the release must not publish: the job stops before the
# tag and publish steps, so a bad commit leaves no tag and nothing on crates.io.
# crates.io is write-once, so this gate runs against the exact release commit.
#
# Prerequisites:
# - main must already be release-ready with a green CI run for its HEAD commit.
#   preflight verifies that green ci.yml run by commit SHA via the GitHub API.
# - The repository secret CARGO_REGISTRY_TOKEN must hold a crates.io API token
#   scoped to publish rf. Without it the publish step fails.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  actions: read # preflight reads the CI proof run via the GitHub API
  contents: write # push the release tag and create the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install ripgrep
        # preflight runs the verification.ci test gate, whose conformance tests
        # execute the `rg` commands the `why` verb emits. `rg` must be on PATH.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install the guard tool (plumbline)
        # Pinned to an exact crates.io version, in lockstep with plumbline.json's
        # config_version. Bump this and the config together in one deliberate
        # migration; never float to a newer schema by surprise.
        run: cargo install plumbline@0.0.4 --locked
      - name: Resolve release version and tag
        # workflow_dispatch releases the version currently in Cargo.toml on the
        # dispatched commit. A tag push releases the version named by the tag.
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rf") | .version')"
            tag="v${version}"
          else
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing rf $version as $tag"
      - name: Prove the built release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          release_prefix="$(mktemp -d)"
          install -m 755 target/release/rf "$release_prefix/rf"
          expected_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rf") | .version')"
          test "$("$release_prefix/rf" --version)" = "rf $expected_version"
          test "$(sha256sum target/release/rf | cut -d' ' -f1)" = "$(sha256sum "$release_prefix/rf" | cut -d' ' -f1)"
          "$release_prefix/rf" conformance --json > "$release_prefix/conformance.json"
          python3 - "$release_prefix/conformance.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          cases = report["data"][0]["cases"]
          allowed_na = {
              "H-01": "rf-requires-a-subcommand",
              "H-03": "help-surface-not-machine-rendered",
              "S-01": "release-build-fault-trigger-unavailable",
              "S-02": "release-build-fault-trigger-unavailable",
              "X-02": "release-build-fault-trigger-unavailable",
          }
          failures = [case for case in cases if case["verdict"] == "fail"]
          observed_na = {case["case_id"]: case["reason"] for case in cases if case["verdict"] == "not_applicable"}
          if failures or observed_na != allowed_na:
              raise SystemExit(f"conformance failure={failures!r}; unexpected not-applicable={observed_na!r}")
          PY
      - name: Validate the 0.0.8 K-record
        run: python3 benchmarks/0.0.8-real-repo/validate.py
      - name: Full preflight stop-sign (local gates + CI proof for this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: plumb preflight
      - name: Create and push the release tag
        # Dispatch path only: preflight passed, so mark the release commit. A tag
        # push created by GITHUB_TOKEN does not retrigger the tag path, so this
        # cannot cause a second publish.
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists on origin. Refusing to republish." >&2
            exit 1
          fi
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "${RELEASE_TAG}" --generate-notes
