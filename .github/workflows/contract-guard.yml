name: Contract guard

# Enforces that the crate documentation prose still agrees with the committed
# release-candidate contract fixture, and that the fixture is not stale before a
# package is cut. The guard tool is `plumbline` (invoked as `plumb`), an
# installed CLI, not an in-repo member; it reads `plumbline.json`. Runs per tree,
# so this crate tree can go green independently of the site tree.

# Skips tracker-only and release-record-only changes. It still runs on
# README.md and CHANGELOG.md: they are plumbline surfaces.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".beads/**"
      - "release-records/**"
      - "RELEASING.md"
      - "CONTRACT.md"
      - "bench/**"
  pull_request:
    paths-ignore:
      - ".beads/**"
      - "release-records/**"
      - "RELEASING.md"
      - "CONTRACT.md"
      - "bench/**"

env:
  PLUMBLINE_VERSION: 0.0.4

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore the Cargo registry and dependency builds
        # Caches ~/.cargo/registry, ~/.cargo/git and target/ dependencies,
        # keyed by rustc version, Cargo.lock and job. rf itself still compiles
        # each run. cache-bin is off: the plumbline step owns ~/.cargo/bin.
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - name: Restore the guard tool (plumbline) from cache
        id: plumb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/plumb
          key: plumbline-${{ env.PLUMBLINE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the guard tool (plumbline)
        # Pinned to an exact crates.io version, in lockstep with plumbline.json's
        # config_version. Bump this and the config together in one deliberate
        # migration; never float to a newer schema by surprise.
        # The binary is cached by version; a restored binary must report that
        # exact version, else it is rebuilt. Bump PLUMBLINE_VERSION with
        # plumbline.json's config_version.
        run: |
          if [ "${{ steps.plumb-cache.outputs.cache-hit }}" = "true" ] \
            && [ "$(plumb --version 2>/dev/null)" = "plumb ${PLUMBLINE_VERSION}" ]; then
            echo "plumbline ${PLUMBLINE_VERSION} restored from cache"
          else
            cargo install "plumbline@${PLUMBLINE_VERSION}" --locked --force
          fi
      - name: Registered claims match the committed fixture
        run: plumb check
      - name: Committed fixture is not stale (re-capture from the built binary)
        run: plumb capture --check
