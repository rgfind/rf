name: Release preflight

# The full publish stop-sign, run automatically when a release tag is pushed.
#
# contract-guard.yml runs the two light checks (`plumb check`, `plumb capture
# --check`) on every push and PR. It does NOT run the worktree-clean,
# packaged-allowlist, or generated-fresh gates — those live only in the manual
# `plumb preflight` a releaser runs by hand (see RELEASING.md). This job closes
# that hole: on a `v*` tag it runs the SAME `plumb preflight` the releaser is
# told to run, so a packaged-file leak or a stale generated block cannot slip
# through to a tagged release.
#
# This job does not publish. `cargo publish` stays a deliberate manual step
# (RELEASING.md). This is a gate, not a release robot: a red run here means the
# tag must not be published as-is.

on:
  push:
    tags: ["v*"]

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the guard tool (plumbline)
        # Pinned to an exact crates.io version, in lockstep with plumbline.json's
        # config_version. Bump this and the config together in one deliberate
        # migration; never float to a newer schema by surprise.
        run: cargo install plumbline@0.0.3 --locked
      - name: Full publish preflight (all five gates)
        run: plumb preflight
